name: example
description: Example app for settings_ui, a gallery of settings screens in every style.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.0.2
  material_ui: ^1.1.1
  settings_ui:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/settings.png
