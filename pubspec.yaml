name: settings_ui
description: Settings screens that look native on iOS, Android, macOS, Windows, Linux (GNOME) and the web, from one API, with sub-pages and a split view for tablets and desktop.
version: 4.0.1
homepage: https://github.com/yako-dev/flutter-settings-ui
repository: https://github.com/yako-dev/flutter-settings-ui
issue_tracker: https://github.com/yako-dev/flutter-settings-ui/issues

topics:
  - settings
  - preferences
  - ui
  - widget
  - adaptive

# At most 10 files of 4 MB each, inside the package (see .pubignore).
screenshots:
  - description: "settings_ui on Android, iOS and an iPad in split view."
    path: assets/v4/header-mobile.png
  - description: "settings_ui on macOS, Windows, Linux (GNOME) and the web, each with its native sidebar."
    path: assets/v4/header-desktop.png
  - description: "iOS style: iOS 26 grouped cards and the CupertinoSettingsSwitch."
    path: assets/v4/gallery/ios.png
  - description: "Android style: Android 16 cards with colors from the Material 3 ColorScheme."
    path: assets/v4/gallery/android.png
  - description: "Split view on an iPad: the list on the left, the selected page on the right."
    path: assets/v4/gallery/ipad-split.png
  - description: "Split view on an unfolded Android foldable."
    path: assets/v4/gallery/fold-split.png
  - description: "macOS style with the System Settings sidebar."
    path: assets/v4/gallery/macos.png
  - description: "Windows 11 style with the Settings navigation pane."
    path: assets/v4/gallery/windows.png
  - description: "GNOME style for Linux with the Settings sidebar."
    path: assets/v4/gallery/gnome.png
  - description: "Web style modeled on the Chrome settings page."
    path: assets/v4/gallery/web.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.0.2
  material_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
